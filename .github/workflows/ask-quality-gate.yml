name: Ask Quality Gate
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  ask-quality-gate:
    runs-on: ubuntu-latest
    # Skip gracefully on forks / environments without the required secret.
    if: ${{ github.event.pull_request.head.repo.fork == false || github.event_name == 'push' }}
    # ADVISORY (2026-05-21): test_ask_golden_set_numeric_gate runs the full
    # 50+ entry golden set against real Anthropic — exceeds 30 min wall time
    # at any timeout setting (see KAN-DRAFT-gate-timeout-bump commit ddbd5dd:
    # "1800s also insufficient"). Until the KAN-146 redesign (slim per-PR /
    # nightly-full split) lands, this gate REPORTS but does NOT BLOCK merges.
    # Drop continue-on-error once KAN-146 ships.
    continue-on-error: true
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reporium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/reporium_test
      REDIS_URL: ""
      INGESTION_API_KEY: test-api-key
      GH_USERNAME: testuser
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run numeric golden-set gate for /intelligence/ask
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio==0.24.0 httpx pyyaml
          pytest tests/test_ask_golden_numeric.py -v -s
