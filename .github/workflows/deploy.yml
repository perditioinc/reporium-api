name: Deploy to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.9
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Cloud SQL Proxy for migrations
        run: |
          curl -sSLo cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.13.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          # Private IP only — proxy will fail if runner can't reach private VPC range.
          # This is expected for GitHub-hosted runners. Migrations run via Cloud Run Job.
          ./cloud-sql-proxy --port 5432 --private-ip \
            perditio-platform:us-central1:reporium-db &
          sleep 5
          echo "Cloud SQL Proxy started (PID $!)"

      - name: Apply database migrations
        continue-on-error: true
        env:
          ENVIRONMENT: production
          GCP_PROJECT: perditio-platform
          DATABASE_URL: postgresql+asyncpg://postgres:${{ secrets.CLOUDSQL_PG_PASS }}@127.0.0.1:5432/reporium
        run: |
          # Migrations run against local proxy (port 5432).
          # On GitHub-hosted runners the proxy cannot reach the private Cloud SQL IP,
          # so this step is best-effort. Run migrations manually via the
          # reporium-alembic Cloud Run Job when adding new migrations.
          alembic upgrade head || echo "Migration step skipped (runner cannot reach private Cloud SQL)"

      - uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        id: deploy
        with:
          service: reporium-api
          region: us-central1
          source: .
          env_vars: |-
            ENVIRONMENT=production
            GRAPH_SNAPSHOT_BUCKET=perditio-platform-bucket
            GRAPH_SNAPSHOT_OBJECT=reporium/graph/knowledge-graph.json
            EMBEDDINGS_AVAILABLE=true
          env_vars_update_strategy: merge
          flags: >-
            --memory=2Gi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --concurrency=8
            --timeout=300
            --add-cloudsql-instances=perditio-platform:us-central1:reporium-db
            --execution-environment=gen2
            --network=default
            --subnet=default
            --vpc-egress=private-ranges-only

      - name: Prune old container images (keep latest 5)
        if: success()
        continue-on-error: true
        run: |
          # Delete untagged images first
          gcloud container images list-tags gcr.io/perditio-platform/reporium-api \
            --filter="NOT tags:*" --format="get(digest)" | \
            while read digest; do
              gcloud container images delete \
                "gcr.io/perditio-platform/reporium-api@${digest}" \
                --quiet --force-delete-tags 2>/dev/null || true
            done
          # Keep only the 5 most recent tagged images
          gcloud container images list-tags gcr.io/perditio-platform/reporium-api \
            --sort-by="~TIMESTAMP" --format="get(digest)" | tail -n +6 | \
            while read digest; do
              gcloud container images delete \
                "gcr.io/perditio-platform/reporium-api@${digest}" \
                --quiet --force-delete-tags 2>/dev/null || true
            done

      - name: Post-deploy taxonomy rebuild
        if: success()
        continue-on-error: true
        env:
          API_URL: https://reporium-api-573778300586.us-central1.run.app
          INGEST_API_KEY: ${{ secrets.INGESTION_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          # Wait for Cloud Run to be healthy
          sleep 15
          # Rebuild taxonomy_values from repo_taxonomy (fast batch INSERT)
          curl -sf -X POST "${API_URL}/taxonomy/rebuild" \
            -H "Authorization: Bearer ${INGEST_API_KEY}" \
            -H "X-Admin-Key: ${ADMIN_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' --max-time 60 \
            && echo "Taxonomy rebuild triggered" || echo "Taxonomy rebuild skipped"
          # Re-derive categories from current tags (idempotent)
          curl -sf -X POST "${API_URL}/admin/backfill/categories" \
            -H "Authorization: Bearer ${INGEST_API_KEY}" \
            -H "X-Admin-Key: ${ADMIN_API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            && echo "Category backfill triggered" || echo "Category backfill skipped"
          # Backfill embeddings (background — don't block deploy)
          curl -sf -X POST "${API_URL}/admin/embeddings/backfill" \
            -H "Authorization: Bearer ${INGEST_API_KEY}" \
            -H "X-Admin-Key: ${ADMIN_API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            && echo "Embeddings backfill triggered" || echo "Embeddings backfill skipped"
          # Bust graph edge cache so new typed-edge query is reflected immediately
          curl -sf -X POST "${API_URL}/admin/cache/graph/invalidate" \
            -H "X-Admin-Key: ${ADMIN_API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            && echo "Graph cache invalidated" || echo "Graph cache invalidation skipped"

      - name: Smoke test graph endpoint
        if: success()
        env:
          API_URL: https://reporium-api-573778300586.us-central1.run.app
        run: |
          python - <<'EOF'
          import json
          import time
          import urllib.error
          import urllib.request

          url = f"{__import__('os').environ['API_URL']}/graph/edges?limit=200&neighbours=5&min_similarity=0.4"
          last_error = None

          for attempt in range(1, 7):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      payload = json.load(response)
                  edge_count = len(payload.get("edges") or [])
                  if edge_count <= 0:
                      raise RuntimeError(f"graph endpoint returned no edges: {payload}")
                  edge_types = payload.get("edgeTypes", [])
                  depends_on_count = sum(
                      1 for e in (payload.get("edges") or [])
                      if e.get("edgeType") == "DEPENDS_ON"
                  )
                  print(
                      "Graph smoke check passed:",
                      {
                          "attempt": attempt,
                          "edge_count": edge_count,
                          "graph_source": payload.get("graph_source"),
                          "total_repos": payload.get("total_repos"),
                          "edge_types": edge_types,
                          "depends_on_in_sample": depends_on_count,
                      },
                  )
                  # Regression guard: DEPENDS_ON edges must be present after nightly rebuild.
                  # Warn if < 50 in sample (snapshot may not be rebuilt yet on first deploy).
                  if "DEPENDS_ON" not in edge_types:
                      print("::warning::DEPENDS_ON not in edgeTypes — snapshot may need rebuild via POST /admin/graph/rebuild-snapshot")
                  elif depends_on_count < 50:
                      print(f"::warning::Only {depends_on_count} DEPENDS_ON edges in 200-edge sample — run nightly graph build to backfill")
                  else:
                      print(f"DEPENDS_ON guard passed: {depends_on_count} edges in sample")
                  break
              except (urllib.error.URLError, urllib.error.HTTPError, RuntimeError, json.JSONDecodeError) as exc:
                  last_error = exc
                  print(f"Attempt {attempt} failed: {exc}")
                  if attempt == 6:
                      raise
                  time.sleep(10)

          if last_error is not None:
              print(f"Recovered after transient graph smoke failure: {last_error}")
          EOF

      - name: Publish api.deployed event
        if: success()
        continue-on-error: true
        run: |
          pip install -q google-cloud-pubsub google-cloud-firestore git+https://github.com/perditioinc/reporium-events.git
          python - <<'EOF'
          import asyncio, os, sys
          sys.path.insert(0, '.')
          from reporium_events.models import EventType
          from reporium_events.publisher import publish_event

          async def main():
              await publish_event(
                  event_type=EventType.API_DEPLOYED,
                  source="reporium-api",
                  payload={
                      "service": "reporium-api",
                      "version": os.getenv("GITHUB_SHA", "unknown")[:7],
                      "url": "https://reporium-api-573778300586.us-central1.run.app",
                  },
              )
              print("Published api.deployed event")

          asyncio.run(main())
          EOF
