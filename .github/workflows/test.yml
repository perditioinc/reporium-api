name: Tests
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reporium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/reporium_test
      REDIS_URL: ""
      INGESTION_API_KEY: test-api-key
      GH_USERNAME: testuser
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: pip install pytest pytest-asyncio==0.24.0 httpx pytest-timeout==2.3.1

      # Alembic migration smoke test: run `alembic upgrade head` against the
      # pgvector service BEFORE pytest. Catches deploy-blocking migration bugs
      # in CI (e.g. bad DDL, autocommit_block misuse, missing env support) that
      # previously only surfaced in the production deploy job or ingestion CI.
      # See #400/#403/#404 — several escaped unit tests.
      - name: Alembic upgrade head (migration smoke test)
        run: alembic upgrade head
        timeout-minutes: 3

      - run: pytest tests/ -v --timeout=60
        timeout-minutes: 10

  notify-on-failure:
    needs: test
    if: failure()
    uses: perditioinc/perditio-devkit/.github/workflows/on-test-failure.yml@main
    with:
      branch: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      run_id: ${{ github.run_id }}
      repo: ${{ github.repository }}
    permissions:
      issues: write
