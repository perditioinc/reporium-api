name: Tests
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reporium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/reporium_test
      REDIS_URL: ""
      INGESTION_API_KEY: test-api-key
      GH_USERNAME: testuser
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: pip install pytest pytest-asyncio==0.24.0 httpx pytest-timeout==2.3.1

      - run: pytest tests/ -v --timeout=60
        timeout-minutes: 10

  # Alembic migration smoke test: run `alembic upgrade head` against a
  # dedicated pgvector service. Catches deploy-blocking migration bugs
  # (bad DDL, autocommit_block misuse, missing env support) that previously
  # only surfaced in production deploy or ingestion CI. See #400/#403/#404.
  #
  # Runs in its own job so the preloaded schema doesn't pollute the test DB
  # used by pytest (which expects to manage schema via fixtures).
  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reporium_migrate_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/reporium_migrate_test
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Alembic upgrade head
        run: alembic upgrade head
        timeout-minutes: 3
      - name: Alembic downgrade -1 / upgrade head (idempotency)
        run: |
          alembic downgrade -1
          alembic upgrade head
        timeout-minutes: 3

  notify-on-failure:
    needs: test
    if: ${{ failure() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    uses: perditioinc/perditio-devkit/.github/workflows/on-test-failure.yml@aa588479da71164c0bd2ee493a76ee46830d10dc # main @ 2026-04-26
    with:
      branch: ${{ github.ref_name }}
      sha: ${{ github.sha }}
      run_id: ${{ github.run_id }}
      repo: ${{ github.repository }}
    permissions:
      issues: write
